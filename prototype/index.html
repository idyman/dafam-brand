<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Da Fam · Prototype</title>

<style>
:root{--navy:#001f5b;--ink:#071943;--muted:#6b7085;--panel:#f5f7fc;--panel2:#edf1fa;--soft:#eef2ff;--line:#e8edf6;--canvas:#c7d1ff;--yellow:#deff00;--gsoft:#eaffe8;--gtext:#0b7a12;--psoft:#ffe8f7;--ptext:#b0007f;--cyan:#00cdff;--purple:#8500ff;--box:#7d86a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);font-family:Heebo,-apple-system,'Arial Hebrew','Noto Sans Hebrew',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
a{color:inherit}
button,input{font-family:inherit;color:inherit}
.stage{width:402px;height:874px;flex-shrink:0;transform-origin:center center}
.phone{width:402px;height:874px;border-radius:46px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #0b0f1c,0 40px 90px rgba(0,31,91,.35);position:relative}
.screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.restart{position:fixed;top:16px;left:16px;font-size:13px;font-weight:800;color:var(--navy);text-decoration:none;background:#fff;border-radius:999px;padding:12px 16px;box-shadow:0 6px 16px rgba(0,31,91,.12)}
@media (max-width:500px){
  body{background:#fff}
  .stage{width:100vw;height:100dvh;transform:none!important}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .fake,.restart{display:none!important}
  .screen{padding-top:env(safe-area-inset-top)}
  .nav{margin-bottom:max(12px,env(safe-area-inset-bottom))!important}
}
@media (max-height:760px){.cover{height:112px!important}}
.sb{flex-shrink:0;height:50px;padding:15px 30px 0;display:flex;align-items:flex-start;justify-content:space-between;position:relative;color:#000}
.sb.light{color:#fff}
.sb .time{width:60px;text-align:center;direction:ltr;font-family:-apple-system,'SF Pro Text',Heebo,sans-serif;font-size:17px;font-weight:650;line-height:20px}
.sb .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:999px;background:#000}
.sb .icons{display:flex;align-items:center;gap:6px;direction:ltr;height:20px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:999px;background:#000}
.homebar.light{background:#fff}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
.content::-webkit-scrollbar,.ob::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.content>*,.ob>*,.sheet>*{flex-shrink:0}
.ob{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 20px 32px;display:flex;flex-direction:column;gap:20px}
.spacer{flex:1 1 auto!important}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
h1{margin:0;font-size:20px;line-height:1.18;font-weight:850}
h1.big{font-size:24px;line-height:1.2}
h2{margin:0;font-size:16px;font-weight:850}
.h3{margin:0;font-size:13px;font-weight:850;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;color:var(--muted)}
.lead{margin:0;font-size:15px;font-weight:500;line-height:1.5;color:#4b5068}
.meta{font-size:12px;font-weight:750;color:var(--muted)}
.link{min-height:44px;display:inline-flex;align-items:center;padding:0 4px;font-size:13px;font-weight:800;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.nav{flex-shrink:0;margin:0 12px 22px;height:70px;background:var(--panel);border-radius:22px;box-shadow:0 24px 62px rgba(0,31,91,.12);display:flex;align-items:center;padding:0 6px;gap:2px}
.nav .grp{flex:1 1 0;display:flex;gap:2px}
.tab{flex:1 1 0;height:56px;border-radius:16px;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800}
.tab.on{background:#fff;color:var(--navy);font-weight:850}
.mic{flex:0 0 auto;width:72px;height:78px;align-self:flex-end;margin-bottom:7px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;color:var(--navy);font-size:12px;font-weight:850}
.mic span{width:58px;height:58px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 5px #fff,0 12px 28px rgba(0,31,91,.18);display:flex;align-items:center;justify-content:center;position:relative}
.mic span i{position:absolute;bottom:-2px;left:-2px;width:22px;height:22px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:850;flex-shrink:0;letter-spacing:-.5px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:6px 10px;min-height:56px}
.chk{width:44px;height:44px;margin:-6px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.chk .box{width:32px;height:32px;border-radius:12px;background:#fff;border:2px solid var(--box);display:flex;align-items:center;justify-content:center}
.chk.on .box{background:var(--yellow);border-color:var(--yellow)}
.dash{width:32px;height:32px;flex-shrink:0;border-radius:12px;border:2px dashed var(--ptext)}
.t{flex:1 1 auto;font-size:14px;font-weight:700}
.done{color:var(--muted)!important;text-decoration:line-through}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 40px rgba(0,31,91,.08)}
.pill{border-radius:999px;font-size:12px;font-weight:850;padding:5px 10px;white-space:nowrap}
.pill.pink{background:var(--psoft);color:var(--ptext)}
.pill.green{background:var(--gsoft);color:var(--gtext)}
.pill.soft{background:var(--soft);color:var(--navy)}
.btn{height:52px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-size:16px;font-weight:850;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn:disabled{background:#c9d2ea;color:#4b5068;cursor:not-allowed}
.btn2{height:48px;border:0;border-radius:999px;background:var(--panel2);color:var(--navy);font-size:15px;font-weight:850;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn.danger{background:var(--ptext)}
.sm{height:44px;border:0;border-radius:999px;font-size:13px;font-weight:850;padding:0 14px;background:var(--navy);color:#fff;cursor:pointer;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.sm.light{background:#fff;color:var(--navy)}
.seg{height:52px;background:var(--panel);border-radius:999px;padding:4px;display:flex;gap:4px}
.seg button{flex:1 1 0;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:800;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:850;box-shadow:0 4px 12px rgba(0,31,91,.08)}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;text-decoration:none}
.sheet{background:#fff;border-radius:34px 34px 0 0;box-shadow:0 24px 62px rgba(0,31,91,.2);padding:10px 16px 28px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none;flex:1 1 auto;margin-top:12px;min-height:0}
.grabber{display:flex;justify-content:center}.grabber span{width:40px;height:5px;border-radius:999px;background:var(--line)}
.label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:850;color:var(--muted)}
.input{height:52px;border:1.5px solid var(--navy);border-radius:18px;padding:0 14px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#fff;unicode-bidi:plaintext;width:100%}
.input.small{height:44px;font-size:15px;width:auto}
.progress{flex:1 1 auto;display:flex;gap:6px}.progress span{flex:1 1 0;height:6px;border-radius:999px;background:var(--line)}.progress span.on{background:var(--navy)}
.switch{width:50px;height:30px;flex-shrink:0;border-radius:999px;padding:3px;display:flex;background:#7d86a0;justify-content:flex-start}
.switch.on{background:var(--navy);justify-content:flex-end}
.switch i{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,31,91,.2)}
.listbtn{min-height:52px;border:0;background:none;padding:4px 0;display:flex;align-items:center;gap:10px;text-align:start;cursor:pointer;width:100%;text-decoration:none}
.chip{min-height:44px;border-radius:999px;padding:0 16px;font-size:14px;font-weight:850;background:#fff;color:var(--navy);border:1.5px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cover{position:relative;height:150px;border-radius:26px;overflow:hidden;background-color:var(--soft);background-size:cover;background-position:center}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.status{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.toast{position:absolute;left:16px;right:16px;bottom:112px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px;font-size:14px;font-weight:800;box-shadow:0 16px 40px rgba(0,31,91,.3);z-index:5;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--yellow),0 0 0 7px rgba(222,255,0,.35)}100%{box-shadow:0 0 0 0 transparent}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.pulse,.flash,.toast{animation:none}}
.edit{background:var(--panel);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.field{min-height:52px;border:0;border-bottom:1px solid var(--line);background:none;padding:0;display:flex;align-items:center;gap:10px;text-align:start;cursor:pointer;width:100%}
.field.warn{background:var(--psoft);border-radius:14px;border-bottom:0;padding:0 10px;margin:2px 0}
</style>
</head>

        var so = M(S.shop.owner);
        a.saved = { title: 'נוסף לקניות לסופר', sub: so ? so.name + ' ' + G(so.form, 'יראה', 'תראה', 'יראה') + ' את זה ברשימה' : '', see: 'לראות ברשימה', go: 'tasks' };
      } else if (a.type === 'event') {
        var t = toMin(a.time); S.events.push({ id: id, day: day, t: t, end: t + 60, title: text, who: owner ? [owner] : adults().map(function (m) { return m.id; }) }); flash(id);
        S.cal.day = day; S.cal.view = 'day'; S.cal.who = 'all';
        a.saved = { title: 'האירוע נוסף ללוח', sub: DAYS[day][2] + ' ' + a.time + ' · ' + (owner ? om.name + ' ' + G(om.form, 'אחראי', 'אחראית', 'אחראי') : 'עוד אין אחראי, נשאל את הבית'), see: 'לראות בלוח', go: 'calendar' };
      } else {
        S.items.push({ id: id, kind: 'task', title: text, owner: owner, day: day, claimed: owner === S.me }); flash(id);
        a.saved = { title: 'המטלה נוספה', sub: DAYS[day][2] + ' · ' + (owner ? (owner === S.me ? G(me().form, 'אתה אחראי', 'את אחראית', 'זה עליך') : om.name + ' ' + G(om.form, 'קיבל', 'קיבלה', 'קיבל') + ' התראה') : 'פתוחה לכל מי שלוקח'), see: day === NOW_DAY ? 'לראות בהיום' : 'לראות במטלות', go: day === NOW_DAY ? 'main' : 'tasks' };
      }
    },
    seeSaved: function () { var go = S.add.saved.go; S.add.saved = null; S.add.text = ''; if (go === 'tasks') S.tasksTab = 'all'; location.hash = go; },
    addAgain: function () { S.add.saved = null; S.add.text = ''; }
  };

  /* ---------- render & routing ---------- */
  var app = document.getElementById('app'), stage = document.getElementById('stage');
  function route() { var r = (location.hash || '#splash').slice(1); return screens[r] ? r : 'splash'; }
  var splashTimer;
  function render(keep) {
    var sc = app.querySelector('.content,.ob,.sheet'), y = keep && sc ? sc.scrollTop : 0;
    var active = document.activeElement && document.activeElement.id;
    var r = route();
    app.innerHTML = screens[r]();
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', r === 'splash' ? '#001f5b' : (r === 'add' ? '#c7d1ff' : '#ffffff'));
    var nsc = app.querySelector('.content,.ob,.sheet'); if (nsc) nsc.scrollTop = y;
    if (keep && active) { var el = document.getElementById(active); if (el) { el.focus(); if (el.type === 'text') { var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} } } }
    clearTimeout(splashTimer);
    if (r === 'splash') splashTimer = setTimeout(function () { if (route() === 'splash') location.hash = 'ob1'; }, 1600);
  }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || !A[el.dataset.act] || el.disabled) return;
    e.preventDefault();
    A[el.dataset.act](el.dataset.arg);
    render(true);
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'qText') { var had = !!S.add.text.trim(); S.add.text = t.value; if (had !== !!t.value.trim()) render(true); }
    else if (t.id === 'hname') S.hname = t.value || 'הבית שלנו';
    else if (t.id === 'kidName') S.ob.kidName = t.value;
    else if (t.id === 'kidAge') S.ob.kidAge = t.value;
    else if (t.id === 'confirmName') { var was = S.fam.confirm.trim() === S.hname.trim(); S.fam.confirm = t.value; if (was !== (t.value.trim() === S.hname.trim())) render(true); }
    else if (t.id === 'vTitle') S.add.f.title = t.value;
    else if (t.id === 'vTime') S.add.f.time = t.value || S.add.f.time;
    else if (t.id === 'qTime') S.add.time = t.value || S.add.time;
    else if (t.id === 'qDate') S.add.date = t.value;
  });
  app.addEventListener('change', function (e) {
    if (!e.target.matches('[data-photo]')) return;
    var f = e.target.files && e.target.files[0]; if (!f) return;
    if (S.photo) URL.revokeObjectURL(S.photo);
    S.photo = URL.createObjectURL(f); render(true);
  });
  window.addEventListener('hashchange', function () {
    var r = route();
    if (r === 'add') {
      if (!S.add.link) { S.addBack = S.prevRoute && S.prevRoute !== 'add' ? S.prevRoute : 'main'; S.add.mode = S.lastMode || 'voice'; S.add.saved = null; S.add.text = ''; }
      S.add.v = 'listening'; S.add.timeOk = false; S.add.edit = null; S.add.prep = false;
    } else if (S.prevRoute === 'add') { S.add.link = null; }
    S.prevRoute = r;
    render(false);
  });
  document.getElementById('restart').addEventListener('click', function (e) { e.preventDefault(); S = fresh(); S.prevRoute = 'splash'; if (route() === 'splash') render(false); else location.hash = 'splash'; });
  function fit() {
    if (window.innerWidth <= 500) { stage.style.transform = 'none'; return; }
    var s = Math.min(1, (window.innerHeight - 48) / 874, (window.innerWidth - 48) / 402);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit(); S.prevRoute = route(); render(false);
})();
</script>
